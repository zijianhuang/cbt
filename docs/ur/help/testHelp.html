<p style=";text-align:right;direction:rtl">ایک ٹیسٹ سیشن پہلی اشی ہارا پلیٹ سے شروع ہوتا ہے اور آخری پلیٹ مکمل ہونے تک جاری رہتا ہے۔</p><p style=";text-align:right;direction:rtl"> ہر اشی ہارا پلیٹ کے لیے، ٹیسٹ کا مضمون دستیاب اختیارات میں سے مناسب بٹن کا انتخاب کرتا ہے۔ جواب منتخب ہونے کے بعد، ایپ اگلی پلیٹ پیش کرتی ہے۔</p><p style=";text-align:right;direction:rtl"> ٹیسٹ سیشن کے اختتام پر، ایپ ٹیسٹ کے نتائج دکھاتی ہے۔</p>
