<p>चाचणीचे सत्र पहिल्या इशिहारा प्लेटपासून सुरू होते आणि शेवटची प्लेट पूर्ण होईपर्यंत चालू राहते.</p><p> प्रत्येक इशिहारा प्लेटसाठी, चाचणी देणारी व्यक्ती उपलब्ध पर्यायांपैकी योग्य बटण निवडते. प्रतिसाद निवडल्यानंतर, ॲप पुढील प्लेट सादर करते.</p><p> चाचणी सत्राच्या शेवटी, ॲप चाचणीचे निकाल दर्शवते.</p>
