<p>جلسه آزمون با نخستین صفحه ایشی‌هارا آغاز می‌شود و تا تکمیل آخرین صفحه ادامه می‌یابد.</p><p> برای هر صفحه ایشیهارا، فرد مورد آزمایش دکمه مناسب را از میان گزینه‌های موجود انتخاب می‌کند. پس از انتخاب پاسخ، برنامه صفحه بعدی را نمایش می‌دهد.</p><p> در پایان جلسه آزمون، برنامه نتایج آزمون را نمایش می‌دهد.</p>
