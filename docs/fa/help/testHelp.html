<p style=";text-align:right;direction:rtl">یک جلسه آزمون با اولین بشقاب ایشی‌هارا آغاز می‌شود و تا تکمیل بشقاب نهایی ادامه می‌یابد.</p><p style=";text-align:right;direction:rtl"> برای هر بشقاب ایشی‌هارا، آزمودنی دکمه‌ی مناسب را از گزینه‌های موجود انتخاب می‌کند. پس از انتخاب پاسخ، برنامه بشقاب بعدی را نمایش می‌دهد.</p><p style=";text-align:right;direction:rtl"> در پایان جلسه آزمون، برنامه نتایج آزمون را نمایش می‌دهد.</p>
