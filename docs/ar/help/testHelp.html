<p style=";text-align:right;direction:rtl">تبدأ جلسة الاختبار بلوحة إيشيهارا الأولى وتستمر حتى اكتمال اللوحة الأخيرة.</p><p style=";text-align:right;direction:rtl"> لكل لوحة من لوحات اختبار إيشيهارا، يختار الشخص الخاضع للاختبار الزر المناسب من بين الخيارات المتاحة. بعد اختيار الإجابة، يعرض التطبيق اللوحة التالية.</p><p style=";text-align:right;direction:rtl"> في نهاية جلسة الاختبار، يعرض التطبيق نتائج الاختبار.</p>
