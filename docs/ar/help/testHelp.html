<p>تبدأ جلسة الاختبار بلوحة &quot;إيشيهارا&quot; الأولى وتستمر حتى الانتهاء من اللوحة الأخيرة.</p><p> بالنسبة لكل لوحة من لوحات &quot;إيشيهارا&quot;، يختار الخاضع للاختبار الزر المناسب من بين الخيارات المتاحة. وبعد اختيار الإجابة، يعرض التطبيق اللوحة التالية.</p><p> في نهاية جلسة الاختبار، يعرض التطبيق نتائج الاختبار.</p>
