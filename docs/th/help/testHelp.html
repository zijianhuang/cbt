<p>การทดสอบจะเริ่มต้นด้วยแผ่นทดสอบ Ishihara แผ่นแรก และดำเนินต่อไปจนกระทั่งทำแผ่นสุดท้ายเสร็จสิ้น</p><p> สำหรับแผ่นทดสอบ Ishihara แต่ละแผ่น ผู้รับการทดสอบจะเลือกปุ่มที่เหมาะสมจากตัวเลือกที่มีให้ หลังจากเลือกคำตอบแล้ว แอปพลิเคชันจะแสดงแผ่นทดสอบถัดไป</p><p> เมื่อสิ้นสุดช่วงการทดสอบ แอปจะแสดงผลการทดสอบ</p>
